name: test

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:10 UTC = 03:10 America/Sao_Paulo (UTC-3, Brazil has no DST)
    - cron: "10 6 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run python -m pytest -v
