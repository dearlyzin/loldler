[project]
name = "loldle"
version = "1.0.0"
description = "Daily auto-solver for all loldle.net puzzle modes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pycryptodome>=3.21",
    "rich>=13.9",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
loldle = "loldle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loldle"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
